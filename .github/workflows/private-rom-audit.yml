name: Private ROM audit (manual)

on:
  workflow_dispatch:
    inputs:
      max_instructions:
        description: "Maximum ARM/Thumb instructions to inspect (analysis budget, not a support claim)"
        required: true
        default: "250000"
        type: string

permissions:
  contents: read

concurrency:
  group: private-rom-audit-main
  cancel-in-progress: false

jobs:
  audit:
    name: Inspect private Emerald ROM (summary only)
    if: ${{ github.repository == 'rakmahefa/gbarecomp-rust' && github.ref == 'refs/heads/main' }}
    environment: roms-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: Checkout gbarecomp-rust
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require the read-only ROM credential and validate budget
        env:
          ROMS_DEPLOY_KEY: ${{ secrets.ROMS_DEPLOY_KEY }}
          MAX_INSTRUCTIONS: ${{ inputs.max_instructions }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ROMS_DEPLOY_KEY" ]]; then
            echo "::error::Missing environment secret ROMS_DEPLOY_KEY. Follow docs/private-rom-workflow.md."
            exit 1
          fi
          if [[ ! "$MAX_INSTRUCTIONS" =~ ^[1-9][0-9]*$ ]] || (( MAX_INSTRUCTIONS > 1000000 )); then
            echo "::error::max_instructions must be an integer from 1 to 1000000."
            exit 1
          fi

      - name: Checkout private ROM repository (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: rakmahefa/roms
          ref: main
          path: .private/roms
          ssh-key: ${{ secrets.ROMS_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config \
            libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libxkbcommon-dev \
            libwayland-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: private-rom-audit-rust-1.98.1

      - name: Inspect ROM and run bounded static analysis
        id: analysis
        env:
          MAX_INSTRUCTIONS: ${{ inputs.max_instructions }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' roms < <(find .private/roms -maxdepth 1 -type f -iname '*.gba' -print0)
          if [[ "${#roms[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one .gba file at the root of rakmahefa/roms; found ${#roms[@]}."
            exit 1
          fi

          rom_path="${roms[0]}"
          cargo build --release --locked --bin gbarecomp-recomp
          binary="target/release/gbarecomp-recomp"
          "$binary" inspect "$rom_path" > "$RUNNER_TEMP/rom-inspect.txt"
          "$binary" analyze "$rom_path" --max-instructions "$MAX_INSTRUCTIONS" > "$RUNNER_TEMP/rom-analysis.txt"

          decoded="$(awk -F': ' '/^Decoded instruction encodings:/ {print $2; exit}' "$RUNNER_TEMP/rom-analysis.txt")"
          blocks="$(awk -F': ' '/^Basic blocks:/ {print $2; exit}' "$RUNNER_TEMP/rom-analysis.txt")"
          diagnostics="$(awk -F': ' '/^Diagnostics:/ {print $2; exit}' "$RUNNER_TEMP/rom-analysis.txt")"
          limit_reached="$(awk -F': ' '/^Limit reached:/ {print $2; exit}' "$RUNNER_TEMP/rom-analysis.txt")"
          checksum_status="$(sed -n 's/^Header checksum:.*(\([^)]*\)).*/\1/p' "$RUNNER_TEMP/rom-inspect.txt" | head -n 1)"
          rom_size="$(awk -F'[()]' '/^Size:/ {print $2; exit}' "$RUNNER_TEMP/rom-inspect.txt")"

          {
            echo "## Private ROM audit summary"
            echo
            echo "- Input repository: rakmahefa/roms@main (checked out using a read-only deploy key)"
            echo "- ROM filename and full inspection/disassembly output are deliberately omitted from this public run summary."
            echo "- ROM size: ${rom_size:-not reported}"
            echo "- Header checksum status: ${checksum_status:-not reported}"
            echo "- Decoded instruction encodings: ${decoded:-not reported}"
            echo "- Basic blocks found: ${blocks:-not reported}"
            echo "- Diagnostics: ${diagnostics:-not reported}"
            echo "- Instruction budget reached: ${limit_reached:-not reported} (limit: $MAX_INSTRUCTIONS)"
            echo
            echo "**Interpretation:** this is a bounded diagnostic run of the currently implemented ARM/Thumb subset. A successful job is not evidence that Pokémon Emerald fully recompiles or runs. Unsupported instructions and unresolved control flow are expected at this stage."
            echo
            echo "**Data handling:** the ROM, raw disassembly, generated source, and detailed reports are not uploaded as artifacts or included in the release. Detailed output remains only in the ephemeral runner and is deleted after the job."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "rom_size=$rom_size"
            echo "checksum_status=$checksum_status"
            echo "decoded=$decoded"
            echo "blocks=$blocks"
            echo "diagnostics=$diagnostics"
            echo "limit_reached=$limit_reached"
          } >> "$GITHUB_OUTPUT"

      - name: Remove checked-out private ROM and raw reports
        if: always()
        shell: bash
        run: |
          rm -rf .private/roms
          rm -f "$RUNNER_TEMP/rom-inspect.txt" "$RUNNER_TEMP/rom-analysis.txt"
