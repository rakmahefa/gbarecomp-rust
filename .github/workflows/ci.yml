name: CI (Linux)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository hygiene, format, lint, and tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Reject tracked ROMs, BIOS files, and save data
        shell: bash
        run: |
          if git ls-files | grep -Eiq '(^|/)(rom|roms)/.*[.](gba|gbc|rom|bin|sav|srm)$|(^|/)bios/|[.](gba|gbc|rom|bin|sav|srm); then
            echo "::error::ROM/BIOS/save files must remain local and untracked."
            git ls-files | grep -Ei '(^|/)(rom|roms|bios)/|[.](gba|gbc|rom|bin|sav|srm)$' || true
            exit 1
          fi

      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config \
            libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libxkbcommon-dev \
            libwayland-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked
